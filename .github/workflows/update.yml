name: サイト更新

on:
  schedule:
    - cron: "17 20 * * *"   # 毎日 日本時間5:17
  workflow_dispatch:         # 手動実行
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "static/**"
      - "config/**"
      - "scripts/build.py"
      - "data/texts/**"
      - "data/shots/**"

concurrency:
  group: site-update
  cancel-in-progress: false

permissions:
  contents: write

env:
  RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
  RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
  HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  HOST: ${{ secrets.XSERVER_HOST }}
  USER_ID: ${{ secrets.XSERVER_USER }}
  PORT: ${{ secrets.XSERVER_PORT }}
  DEST: ${{ secrets.XSERVER_PATH }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 画像に使う日本語フォント。aptは時間がかかることがあるので、1回落としたものを使い回す
      - uses: actions/cache@v4
        with:
          path: ~/.fonts
          key: noto-sans-cjk-bold-v1

      - name: 部品の準備
        run: |
          pip install -r requirements.txt
          mkdir -p ~/.fonts
          if [ ! -s ~/.fonts/NotoSansCJKjp-Bold.otf ]; then
            curl -fsSL --retry 3 -o ~/.fonts/NotoSansCJKjp-Bold.otf https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Japanese/NotoSansCJKjp-Bold.otf \
              || { rm -f ~/.fonts/NotoSansCJKjp-Bold.otf; sudo apt-get install -y -qq fonts-noto-cjk > /dev/null; }
          fi
          ls -la ~/.fonts
          mkdir -p data/logs
          echo "実行 $(TZ=Asia/Tokyo date '+%F %T') ${{ github.event_name }}" > data/logs/latest.txt
          for n in RAKUTEN_APP_ID RAKUTEN_ACCESS_KEY HOTPEPPER_API_KEY GEMINI_API_KEY HOST USER_ID PORT DEST; do
            if [ -n "${!n}" ]; then echo "設定あり $n"; else echo "未設定 $n"; fi
          done | python scripts/redact.py

      # push のときはデータを取り直さず、ページの作り直しと転送だけ行う
      - name: イベント情報の取得
        if: github.event_name != 'push'
        run: cd scripts && python fetch_events.py 2>&1 | python redact.py; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: 楽天トラベルの宿と空室の取得
        if: github.event_name != 'push'
        run: cd scripts && python fetch_hotels.py 2>&1 | python redact.py; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: ホットペッパーの飲食店の取得
        if: github.event_name != 'push'
        run: cd scripts && python fetch_restaurants.py 2>&1 | python redact.py; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: 公式サイトの画面を撮影
        if: github.event_name != 'push'
        run: |
          pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium > /dev/null 2>&1
          cd scripts && python fetch_shots.py 2>&1 | python redact.py; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: 解説文の生成（新しいイベントだけ）
        if: github.event_name != 'push'
        run: cd scripts && python write_texts.py 2>&1 | python redact.py; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: ページの生成
        run: cd scripts && python build.py 2>&1 | python redact.py; exit ${PIPESTATUS[0]}

      - name: Xサーバーへ転送
        id: deploy
        env:
          KEY: ${{ secrets.XSERVER_SSH_KEY }}
        run: |
          set -o pipefail
          # 転送先がちか宿の公開フォルダでなければ止める（ほかのサイトを消さないため）
          case "$DEST" in
            */xn--u8j0b149r.jp/public_html|*/xn--u8j0b149r.jp/public_html/) ;;
            *) echo "転送先のパスが想定と違うため中止しました" | python scripts/redact.py; exit 1 ;;
          esac
          if [ ! -s dist/index.html ]; then echo "ページが生成されていないため中止しました" | python scripts/redact.py; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/xserver
          chmod 600 ~/.ssh/xserver
          (ssh-keygen -y -f ~/.ssh/xserver > /dev/null 2>&1 && echo "鍵の形式は正常" || echo "鍵を読み込めません（貼り付けた中身を確認）") | python scripts/redact.py
          # つながらないときは少し待って3回まで試す
          for attempt in 1 2 3; do
            if rsync -az --delete --stats \
                --exclude '.well-known/' --exclude 'google*.html' \
                -e "ssh -p ${PORT:-10022} -i $HOME/.ssh/xserver -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30" \
                dist/ "$USER_ID@$HOST:${DEST%/}/" > rsync.log 2>&1; then
              tail -6 rsync.log | python scripts/redact.py
              echo "転送完了（${attempt}回目）" | python scripts/redact.py
              # 空室検索（PHP）用のキーを、公開フォルダの外に置く
              mkdir -p priv
              python - <<'PY'
          import os
          v = lambda n: os.environ.get(n, "").replace("\\", "").replace("'", "")
          open("priv/config.php", "w").write(
              "<?php\nreturn ['app_id' => '%s', 'access_key' => '%s'];\n" % (v("RAKUTEN_APP_ID"), v("RAKUTEN_ACCESS_KEY")))
          PY
              PRIV="${DEST%/public_html*}/chikayado_private/"
              rsync -az --chmod=D700,F600 -e "ssh -p ${PORT:-10022} -i $HOME/.ssh/xserver -o BatchMode=yes -o ConnectTimeout=30" \
                priv/ "$USER_ID@$HOST:$PRIV" > priv.log 2>&1 && echo "空室検索の設定を配置" | python scripts/redact.py || (tail -3 priv.log | python scripts/redact.py)
              rm -rf priv
              # 空室検索が動くか試す（次の土曜日、2人）
              SAT=$(python -c "from datetime import date,timedelta;t=date.today();print(t+timedelta(days=(5-t.weekday())%7 or 7))")
              curl -s -m 60 -o search_test.txt -w "空室検索のテスト HTTP %{http_code}\n" "https://xn--u8j0b149r.jp/api/search.php?venue=tokyo-big-sight&date=$SAT&adults=2" | python scripts/redact.py || true
              python -c "import sys;b=open('search_test.txt',encoding='utf-8',errors='replace').read();print('応答の長さ',len(b));print(b[:400].replace(chr(10),' '))" | python scripts/redact.py || true
              exit 0
            fi
            tail -4 rsync.log | python scripts/redact.py
            echo "転送に失敗（${attempt}回目）" | python scripts/redact.py
            sleep 60
          done
          exit 1
        continue-on-error: true

      - name: IndexNowに新しいページを知らせる
        if: github.event_name != 'push' && steps.deploy.outcome == 'success'
        run: cd scripts && python indexnow.py 2>&1 | python redact.py; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: データと実行ログを保存
        if: always()
        run: |
          rm -f ~/.ssh/xserver
          git config user.name "chikayado-bot"
          git config user.email "chikayado-bot@users.noreply.github.com"
          # push で動いたときはデータを取り直していないので、保存しない
          if [ "${{ github.event_name }}" = "push" ]; then exit 0; fi
          git add data
          git diff --cached --quiet || git commit -m "データ更新 $(TZ=Asia/Tokyo date +%F) [skip ci]"
          # 途中で別の更新が入っていても、今回取ったデータを優先して保存する
          git pull --rebase -X theirs -q && git push

      - name: 転送の失敗を知らせる
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "Xサーバーへの転送に失敗しました。data/logs/latest.txt を確認してください"
          exit 1
