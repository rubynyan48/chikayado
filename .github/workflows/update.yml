name: サイト更新

on:
  schedule:
    - cron: "17 20 * * *"   # 毎日 日本時間5:17
  workflow_dispatch:         # 手動実行
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "static/**"
      - "config/**"
      - "scripts/build.py"
      - "data/texts/**"

concurrency:
  group: site-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 部品の準備
        run: pip install -r requirements.txt

      # push のときはデータを取り直さず、ページの作り直しと転送だけ行う
      - name: イベント情報の取得
        if: github.event_name != 'push'
        working-directory: scripts
        run: python fetch_events.py
        continue-on-error: true

      - name: 楽天トラベルの宿と空室の取得
        if: github.event_name != 'push'
        working-directory: scripts
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: python fetch_hotels.py
        continue-on-error: true

      - name: ホットペッパーの飲食店の取得
        if: github.event_name != 'push'
        working-directory: scripts
        env:
          HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}
        run: python fetch_restaurants.py
        continue-on-error: true

      - name: 解説文の生成（新しいイベントだけ）
        if: github.event_name != 'push'
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python write_texts.py
        continue-on-error: true

      - name: 取得したデータを保存
        if: github.event_name != 'push'
        run: |
          git config user.name "chikayado-bot"
          git config user.email "chikayado-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "データ更新 $(date +%F)"
          git push

      - name: ページの生成
        working-directory: scripts
        run: python build.py

      - name: Xサーバーへ転送
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER: ${{ secrets.XSERVER_USER }}
          PORT: ${{ secrets.XSERVER_PORT }}
          KEY: ${{ secrets.XSERVER_SSH_KEY }}
          DEST: ${{ secrets.XSERVER_PATH }}
        run: |
          # 転送先がちか宿の公開フォルダでなければ止める（ほかのサイトを消さないため）
          case "$DEST" in
            */xn--u8j0b149r.jp/public_html|*/xn--u8j0b149r.jp/public_html/) ;;
            *) echo "転送先のパスが想定と違うため中止しました"; exit 1 ;;
          esac
          if [ ! -s dist/index.html ]; then echo "ページが生成されていないため中止しました"; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/xserver
          chmod 600 ~/.ssh/xserver
          rsync -az --delete \
            --exclude '.htaccess' --exclude '.well-known/' --exclude 'google*.html' \
            -e "ssh -p ${PORT:-10022} -i ~/.ssh/xserver -o StrictHostKeyChecking=accept-new" \
            dist/ "$USER@$HOST:${DEST%/}/"
          rm -f ~/.ssh/xserver
