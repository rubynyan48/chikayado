name: クリニックの公式サイトの撮影

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt playwright==1.48.0 opencv-python-headless==4.10.0.84
          python -m playwright install --with-deps chromium > /dev/null 2>&1
          cd scripts && python clinic_shots.py
      - run: |
          git config user.name "chikayado-bot"
          git config user.email "chikayado-bot@users.noreply.github.com"
          git add data/shots
          git diff --cached --quiet || git commit -qm "クリニックの公式サイトの画面 [skip ci]"
          git pull --rebase -q && git push
