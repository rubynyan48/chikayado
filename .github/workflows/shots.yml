name: 公式サイトの画面のまとめ撮り

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SHOTS_MAX: "300"
      SHOTS_MINUTES: "55"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt playwright==1.48.0 opencv-python-headless==4.10.0.84
          python -m playwright install --with-deps chromium > /dev/null 2>&1
          cd scripts && python fetch_shots.py 2>&1 | python redact.py | tail -40
      # 撮った画像を保存する。data/shots が変わるとサイト更新（ページの作り直しと転送）が自動で動く
      - run: |
          git config user.name "chikayado-bot"
          git config user.email "chikayado-bot@users.noreply.github.com"
          git add data/shots
          git diff --cached --quiet || git commit -qm "公式サイトの画面のまとめ撮り"
          git pull --rebase -q && git push
