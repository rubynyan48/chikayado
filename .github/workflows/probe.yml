name: 会場サイトの下調べ

# 見本用（kyotsu-test ブランチだけ）。共通テストの試験場の場所と宿と空室を取ってブランチに保存する。転送はしない。mainに入れる前に元に戻す。
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
  RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt
          cd scripts && python geocode_exams.py
          cd .. && cp -r config/exams /tmp/exams
          # 試験場だけを残す（ほかの会場とクリニックのデータには触らない）
          rm -rf config/venues/*.json config/clinics
      - run: cd scripts && python fetch_hotels.py 2>&1 | grep -v -i "key\|id="
        continue-on-error: true
      - run: |
          git config user.name "chikayado-bot"
          git config user.email "chikayado-bot@users.noreply.github.com"
          git checkout -- config data/logs 2>/dev/null || true
          cp -r /tmp/exams/. config/exams/
          git add config/exams
          git -c core.quotepath=off ls-files -mo --exclude-standard -z data | grep -zE "exam-" | xargs -0 git add --
          git commit -qm "共通テストの試験場の見本用データ [skip ci]" && git pull --rebase -q && git push
