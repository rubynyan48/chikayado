name: 会場サイトの下調べ

# 見本用（venues-1116 ブランチだけ）。IGアリーナと神戸ワールド記念ホールのデータを取ってブランチに保存する。転送はしない。mainに入れる前に元に戻す。
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
  RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
  HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt playwright==1.48.0 opencv-python-headless==4.10.0.84
          python -m playwright install --with-deps chromium > /dev/null 2>&1
          # 新しい2会場だけを残す（ほかの会場とクリニックのデータには触らない）
          find config/venues -name '*.json' ! -name 'ig-arena.json' ! -name 'kobe-world-hall.json' -delete
          rm -rf config/clinics
      - run: |
          cd scripts && python - <<'PY'
          from fetch_hotels import VACANT_URL, base_params, headers
          from common import polite_get
          from datetime import date, timedelta
          d = date.today() + timedelta(days=14)
          for small, det in (('kobe', ''), ('kobe', 'A'), ('kobe', 'B'), ('kobe', 'C')):
              p = {k: v for k, v in base_params({'lat': 0, 'lng': 0}).items() if k not in ('latitude', 'longitude', 'searchRadius')}
              p.update(largeClassCode='japan', middleClassCode='hyogo', smallClassCode=small, datumType=1, checkinDate=d.isoformat(), checkoutDate=(d + timedelta(days=1)).isoformat(), adultNum=1, roomNum=1, hits=30, page=1)
              if det: p['detailClassCode'] = det
              r = polite_get(VACANT_URL, p, headers())
              hs = r.json().get('hotels', []) if r is not None else []
              print('地区', small, det, len(hs), [h['hotel'][0]['hotelBasicInfo'].get('address2', '')[:12] for h in hs[:3]])
          PY
        continue-on-error: true
      - run: cd scripts && python fetch_events.py
        continue-on-error: true
      - run: cd scripts && python fetch_hotels.py 2>&1 | grep -v -i "key\|id="
        continue-on-error: true
      - run: cd scripts && python fetch_restaurants.py 2>&1 | grep -v -i "key"
        continue-on-error: true
      - run: cd scripts && python fetch_shots.py
        continue-on-error: true
      - run: cd scripts && python write_texts.py
        continue-on-error: true
      - run: |
          git config user.name "chikayado-bot"
          git config user.email "chikayado-bot@users.noreply.github.com"
          git checkout -- config data/logs 2>/dev/null || true
          git -c core.quotepath=off ls-files -mo --exclude-standard -z data | grep -zE "ig-arena|kobe-world-hall|IGアリーナ|神戸ワールド記念ホール|ワールド記念ホール" | xargs -0 git add --
          git commit -qm "IGアリーナと神戸ワールド記念ホールの見本用データ [skip ci]" && git pull --rebase -q && git push
