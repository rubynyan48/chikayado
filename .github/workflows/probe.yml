name: 会場サイトの下調べ

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: mkdir -p data/probe && python scripts/probe.py | tee data/probe/result.txt
      - run: |
          git config user.name "chikayado-bot"
          git config user.email "chikayado-bot@users.noreply.github.com"
          git add data/probe
          git commit -qm "会場サイトの下調べ [skip ci]" && git pull --rebase -q && git push
