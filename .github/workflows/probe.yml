name: 会場サイトの下調べ

# far-areas ブランチだけ。楽天の地区番号（東京23区の詳細地区）がどの街かを宿の名前で確かめる。mainに入れる前に元に戻す。
on:
  workflow_dispatch:

env:
  RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
  RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt
          cd scripts && python - <<'PY' 2>&1 | grep -v -i "key"
          import requests
          from common import env
          from fetch_hotels import HOTEL_URL, headers
          for mid, small, det in [("tokyo","tokyo","F"),("tokyo","tokyo","G"),("tokyo","tokyo","H"),("saitama","saitama",""),("saitama","tokorozawa",""),("saitama","kawagoe","")]:
              p = {"applicationId": env("RAKUTEN_APP_ID"), "accessKey": env("RAKUTEN_ACCESS_KEY"), "format": "json", "formatVersion": 2,
                   "largeClassCode": "japan", "middleClassCode": mid, "smallClassCode": small, "hits": 8}
              if det: p["detailClassCode"] = det
              r = requests.get(HOTEL_URL, params=p, headers=headers(), timeout=30)
              names = [h[0]["hotelBasicInfo"]["hotelName"] + "(" + (h[0]["hotelBasicInfo"].get("address1","") + h[0]["hotelBasicInfo"].get("address2",""))[:10] + ")" for h in r.json().get("hotels", [])] if r.ok else [r.status_code, r.text[:120]]
              print("地区", mid, small, det, names)
          PY
