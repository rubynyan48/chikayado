name: 下調べ（地区コード、一回きり）
on: workflow_dispatch
permissions:
  contents: write
jobs:
  areas:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deep-links'
    env:
      TZ: Asia/Tokyo
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: cd scripts && python area_codes_once.py
      - run: |
          git config user.name "chikayado-bot"; git config user.email "chikayado-bot@users.noreply.github.com"
          git add -f data/probe && git commit -qm "地区コードの下調べ [skip ci]" && git push
