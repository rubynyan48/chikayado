name: Search ConsoleとGA4の取得

on:
  schedule:
    - cron: "43 23 * * *"   # 毎日 日本時間8:43（URL検査は1回で約160件ずつ）
  workflow_dispatch:         # 手動実行（Claudeがコマンドで動かす）

concurrency:
  group: site-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt google-auth==2.35.0
      - name: 取得
        run: |
          mkdir -p data/logs
          echo "SEO取得 $(TZ=Asia/Tokyo date '+%F %T')" > data/logs/seo.txt
          cd scripts && python -u seo_report.py 2>&1 | tee -a ../data/logs/seo.txt; code=${PIPESTATUS[0]}
          python -u request_list.py 2>&1 | tee -a ../data/logs/seo.txt
          exit $code
        continue-on-error: true
        timeout-minutes: 25
      - name: 保存
        if: always()
        run: |
          git config user.name "chikayado-bot"
          git config user.email "chikayado-bot@users.noreply.github.com"
          mkdir -p data/seo && git add -A data/seo data/logs/seo.txt
          git diff --cached --quiet || git commit -m "SEOデータ更新 $(TZ=Asia/Tokyo date +%F) [skip ci]"
          git pull --rebase -X theirs -q && git push
