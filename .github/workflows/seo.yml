name: Search ConsoleとGA4の取得

on:
  schedule:
    - cron: "43 23 * * 1"   # 毎週火曜 日本時間8:43
  workflow_dispatch:         # 手動実行（Claudeがコマンドで動かす）

concurrency:
  group: site-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt google-auth==2.35.0
      - name: 取得
        run: |
          mkdir -p data/logs
          echo "SEO取得 $(TZ=Asia/Tokyo date '+%F %T')" > data/logs/seo.txt
          cd scripts && python seo_report.py 2>&1 | tee -a ../data/logs/seo.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: 保存
        run: |
          git config user.name "chikayado-bot"
          git config user.email "chikayado-bot@users.noreply.github.com"
          git add data/seo data/logs/seo.txt
          git diff --cached --quiet || git commit -m "SEOデータ更新 $(TZ=Asia/Tokyo date +%F) [skip ci]"
          git pull --rebase -X theirs -q && git push
